<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socio Manager - Autentikasi Threads</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      max-width: 500px;
      margin: 40px auto;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; }
    .code-box {
      background: #090d16;
      padding: 14px;
      border-radius: 8px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      word-break: break-all;
      color: #4ade80;
      margin: 18px 0;
      border: 1px solid #1e293b;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Otorisasi Berhasil!</h2>
    <p>Kode otorisasi dari Threads Anda:</p>
    <div id="codeDisplay" class="code-box">Mendeteksi kode...</div>
    <button onclick="copyCode()">Salin Kode Otorisasi</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let code = urlParams.get('code');
    const display = document.getElementById('codeDisplay');
    
    if (code) {
      // Threads kadang menambahkan #_ di akhir code, bersihkan jika ada
      code = code.replace(/#_$/, '');
      display.innerText = code;
    } else {
      display.innerText = "Halaman callback aktif. Menunggu parameter code dari Meta Threads...";
    }

    function copyCode() {
      if (code) {
        navigator.clipboard.writeText(code);
        alert("Kode berhasil disalin! Silakan tempel di aplikasi SocioGram.");
      } else {
        alert("Tidak ada kode untuk disalin.");
      }
    }
  </script>
</body>
</html>
